name: Eval (LLM)

# Runs an LLM translator (Claude or Gemini) over the corpus and gates it
# against corpus/baselines/<translator>.json when that file exists. Started
# by hand because every run costs money; it needs the ANTHROPIC_API_KEY or
# GEMINI_API_KEY secret.

on:
  workflow_dispatch:
    inputs:
      translator:
        description: Provider
        default: claude
        type: choice
        options: [claude, gemini]
      split:
        description: Corpus split to score (test is the held-out set)
        default: test
        type: choice
        options: [test, train]
      effort:
        description: Effort
        default: medium
        type: choice
        options: [low, medium, high, xhigh, max]
      model:
        description: Model (empty for the provider's default)
        default: ''
        type: string

permissions:
  contents: read

jobs:
  eval:
    name: Score the LLM translator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run
        env:
          TRANSLATOR: ${{ inputs.translator }}
          SPLIT: ${{ inputs.split }}
          EFFORT: ${{ inputs.effort }}
          MODEL: ${{ inputs.model }}
        run: |
          extra=()
          if [ -f "corpus/baselines/$TRANSLATOR.json" ]; then
            extra+=(--baseline "corpus/baselines/$TRANSLATOR.json")
          fi
          if [ -n "$MODEL" ]; then
            extra+=(--model "$MODEL")
          fi
          pnpm -s eval run --translator "$TRANSLATOR" --split "$SPLIT" --effort "$EFFORT" \
            --out eval-report "${extra[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report/
          if-no-files-found: ignore
          retention-days: 30
